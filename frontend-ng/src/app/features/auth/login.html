<div class="flex flex-col items-center justify-center gap-8 h-screen">
  <div class="login-title">
    <h2>Serichai Web Portal</h2>
  </div>
  <div class="login-content w-112.5">
    <div class="login-form flex flex-col gap-6 px-4 py-8 border border-[#E5E7EB] sm:rounded-xl sm:px-10">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Username</legend>
        <input type="text" id="username" class="input w-full" placeholder="Username" />
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Password</legend>
        <input type="password" id="password" class="input w-full" placeholder="Password" />
      </fieldset>
      <app-button extraClass="bg-primary-cont text-on-primary-cont px-4 py-2 rounded">Sign in</app-button>
    </div>
  </div>
</div>
