<app-layout>
  <div class="flex flex-col gap-4 p-8">
    <h3 class="bold">About</h3>
    <div class="card w-96 p-6 bg-white border border-gray-300 rounded shadow-sm">
      <app-result-panel [status]="call.status()" [error]="call.error()" pendingText="Loading system information...">
        @if (call.data(); as info) {
          <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2">
            <dt class="text-neutral-500">Application</dt>
            <dd class="font-semibold">{{ info.appName }}</dd>
            <dt class="text-neutral-500">Version</dt>
            <dd class="font-semibold">{{ info.appVersion }}</dd>
            <dt class="text-neutral-500">Server time</dt>
            <dd class="font-semibold">{{ info.serverTime }}</dd>
            <dt class="text-neutral-500">Status</dt>
            <dd><span class="badge badge-success">{{ info.status }}</span></dd>
          </dl>
        }
      </app-result-panel>
    </div>
  </div>
</app-layout>
