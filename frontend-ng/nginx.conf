server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Excel uploads: nginx's 1 MB default would reject larger workbooks.
    client_max_body_size 20m;

    # SPA fallback: the Angular router handles client-side routes, so a hard
    # refresh on e.g. /tax-deduction must still resolve to index.html rather
    # than a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the backend API so the SPA and API share one origin
    # (API_BASE_URL is "" in this build, producing requests like
    # /accounts/employee-benefits).
    location /accounts/ {
        proxy_pass http://backend:8000/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
