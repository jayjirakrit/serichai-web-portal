server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router's BrowserRouter handles client-side routes,
    # so a hard refresh on e.g. /tax-deduction must still resolve to
    # index.html rather than a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the backend API so the SPA and API share one origin
    # (frontend/src/services/apiConfig.ts resolves to a relative "" base URL
    # in this build, producing requests like /accounts/employee-benefits).
    location /accounts/ {
        proxy_pass http://backend:8000/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
